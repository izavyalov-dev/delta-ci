name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: delta
          POSTGRES_PASSWORD: delta
          POSTGRES_DB: delta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://delta:delta@localhost:5432/delta_ci?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./cmd/...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
